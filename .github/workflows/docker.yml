name: docker

# Pull requests and pushes to main: build the image, smoke test it and run
# install.sh end to end against it (nothing is pushed). A pushed release tag (vX.Y.Z): build, smoke test the amd64 image,
# then publish the multi-arch image to ghcr.io/<owner>/memry-server as X.Y.Z,
# and as latest when the tag is the highest stable release.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

# One group per ref: branch and PR runs cancel superseded runs; every tag gets
# its own run, which is never cancelled.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

jobs:
  install-script:
    name: Install script (lint and unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck install.sh tests/install/install_test.sh docker/install-e2e.sh

      # Includes the check that install.sh pins the latest CHANGELOG release.
      - name: Unit tests
        run: sh tests/install/install_test.sh

  build-and-smoke:
    name: Build image and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 build)
        if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: memry-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          SKIP_BUILD: "1"
          MEMRY_IMAGE: memry-server:ci
        run: docker/smoke.sh

      # install.sh twice (idempotency) with the compose and env files of this
      # checkout instead of the raw GitHub tag, and without the memry CLI.
      - name: Install script end to end
        env:
          MEMRY_IMAGE: memry-server:ci
        run: docker/install-e2e.sh

      - name: Image metadata
        if: env.PUBLISH == 'true'
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=memry-server
            org.opencontainers.image.description=memry Community, the self-hosted memry MCP memory server
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=memry-server
            org.opencontainers.image.description=memry Community, the self-hosted memry MCP memory server
            org.opencontainers.image.licenses=MIT

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only reached when the smoke test passed. The amd64 layers come from the
      # build above via the gha cache; arm64 is built under QEMU.
      - name: Build and push multi-arch image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Checked against the remote tags right before moving latest (not at the
      # start of the run), so an older or backport tag never takes it over.
      - name: Point latest at this release if it is the highest stable tag
        if: env.PUBLISH == 'true'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          highest="$(git ls-remote --tags --refs origin 'refs/tags/v*' \
            | sed 's|.*refs/tags/||' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n 1 || true)"
          echo "highest stable tag: ${highest:-none}, this tag: ${TAG}"
          if [ "$TAG" != "$highest" ]; then
            echo "Not the highest stable tag; latest is left unchanged."
            exit 0
          fi
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${VERSION}"
