# memry Community: example Docker Compose setup.
#
#   cp docker/community.env.example .env   # then set APP_KEY, APP_URL and DB_PASSWORD
#   docker compose up -d --build
#   docker compose run --rm app token you@example.com
#
# Published image instead of a local build: set MEMRY_IMAGE in .env, e.g.
#   MEMRY_IMAGE=ghcr.io/mrtheroi/memry-server:<version>
# then run `docker compose pull` before starting. `build: .` is only used when
# the image is missing locally, so a source checkout can still build it.
#
# See docs/self-hosting.md for details.

x-app: &app
  image: ${MEMRY_IMAGE:-memry-server:local}
  build: .
  restart: unless-stopped
  environment: &app-env
    APP_NAME: ${APP_NAME:-memry}
    APP_KEY: ${APP_KEY:-}
    APP_URL: ${APP_URL:-http://localhost:8000}
    DB_CONNECTION: pgsql
    DB_HOST: ${DB_HOST:-postgres}
    DB_PORT: ${DB_PORT:-5432}
    DB_DATABASE: ${DB_DATABASE:-memry}
    DB_USERNAME: ${DB_USERNAME:-memry}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    DB_SSLMODE: ${DB_SSLMODE:-prefer}
    MAIL_MAILER: ${MAIL_MAILER:-log}
    MAIL_SCHEME: ${MAIL_SCHEME:-}
    MAIL_HOST: ${MAIL_HOST:-}
    MAIL_PORT: ${MAIL_PORT:-587}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-memry@example.com}
    MAIL_FROM_NAME: ${MAIL_FROM_NAME:-memry}
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    AUTO_MIGRATE: ${AUTO_MIGRATE:-false}
  depends_on:
    postgres:
      condition: service_healthy

services:
  app:
    <<: *app
    command: serve
    ports:
      - "${APP_PORT:-8000}:8000"

  scheduler:
    <<: *app
    command: scheduler
    healthcheck:
      disable: true

  migrate:
    <<: *app
    command: migrate
    restart: "no"
    healthcheck:
      disable: true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-memry}
      POSTGRES_USER: ${DB_USERNAME:-memry}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
